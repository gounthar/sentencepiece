name: Build riscv64 wheel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upstream release tag to build from'
        required: false
        type: string
  schedule:
    - cron: '0 2 * * 0'

jobs:
  build:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libprotobuf-dev protobuf-compiler

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build C++ library
        run: |
          mkdir -p build && cd build
          cmake .. -DSPM_ENABLE_SHARED=OFF -DCMAKE_INSTALL_PREFIX=$(pwd)/root
          make -j$(nproc)
          make install

      - name: Build wheels (cp310-cp314)
        run: |
          cd python
          for PY in 3.10 3.11 3.12 3.13 3.14; do
            uvx --python "$PY" --with setuptools --with wheel pip wheel --no-deps --wheel-dir /tmp/wheels/ .
          done

      - name: Verify platform tags
        run: |
          for whl in /tmp/wheels/*.whl; do
            if echo "$whl" | grep -q "linux_riscv64"; then
              echo "OK: $whl"
            else
              echo "FAIL: $whl missing riscv64 tag"
              exit 1
            fi
          done

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-riscv64
          path: /tmp/wheels/*.whl
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wheels

  release:
    needs: build
    runs-on: ubuntu-24.04-riscv
    if: success()
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheels-riscv64
          path: /tmp/wheels/

      - name: Get wheel info
        id: wheel_info
        run: |
          WHL=$(ls /tmp/wheels/*.whl | head -1)
          BASENAME=$(basename "$WHL")
          VERSION=$(echo "$BASENAME" | sed 's/^[^-]*-\([^-]*\)-.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd /tmp/wheels
          sha256sum *.whl > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="riscv64-v${{ steps.wheel_info.outputs.version }}"
          TITLE="riscv64 wheels v${{ steps.wheel_info.outputs.version }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Prebuilt riscv64 wheels for Python 3.10–3.14.

          Built on: RISE riscv64 runner (ubuntu-24.04-riscv)

          Install:
          \`\`\`
          pip install sentencepiece --find-links https://github.com/${{ github.repository }}/releases/download/$TAG/
          \`\`\`" \
            /tmp/wheels/*.whl \
            /tmp/wheels/SHA256SUMS

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wheels
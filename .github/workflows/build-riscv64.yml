name: Build riscv64 wheel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upstream release tag to build from'
        required: false
        type: string
  schedule:
    - cron: '0 2 * * 0'

jobs:
  build:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    # Runs upstream build code: no write access, no persisted token.
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.src.outputs.sha }}
    env:
      # abseil >= 20260526.0 static_asserts std::atomic<uint8_t-enum> is lock free.
      # GCC 13 (Ubuntu 24.04 default) does not inline sub-word atomics on riscv64,
      # so the assert fails; GCC 14 does.
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Resolve upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo google/sentencepiece --json tagName --jq .tagName)
          fi
          echo "Building google/sentencepiece at $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Tags live upstream and are not mirrored to this fork, so check out
      # google/sentencepiece directly.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: google/sentencepiece
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Record source commit
        id: src
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ ! -f python/build_bundled.sh ]; then
            echo "::error::$TAG has no python/build_bundled.sh (pre-0.2 layout); not supported"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config gcc-14 g++-14

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Same script upstream's setup.py falls back to; builds into python/build.
      - name: Build C++ library
        run: |
          cd python
          sh ./build_bundled.sh

      - name: Build wheels (cp310-cp314)
        run: |
          cd python
          for PY in 3.10 3.11 3.12 3.13 3.14; do
            uvx --python "$PY" --with setuptools --with wheel pip wheel --no-deps --wheel-dir /tmp/wheels/ .
          done

      - name: Verify platform tags
        run: |
          for whl in /tmp/wheels/*.whl; do
            if echo "$whl" | grep -q "linux_riscv64"; then
              echo "OK: $whl"
            else
              echo "FAIL: $whl missing riscv64 tag"
              exit 1
            fi
          done

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-riscv64
          path: /tmp/wheels/*.whl
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wheels

  release:
    needs: build
    runs-on: ubuntu-24.04-riscv
    if: success()
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheels-riscv64
          path: /tmp/wheels/

      - name: Get wheel info
        id: wheel_info
        run: |
          WHL=$(ls /tmp/wheels/*.whl | head -1)
          BASENAME=$(basename "$WHL")
          VERSION=$(echo "$BASENAME" | sed 's/^[^-]*-\([^-]*\)-.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd /tmp/wheels
          sha256sum *.whl > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_TAG: ${{ needs.build.outputs.tag }}
          SRC_SHA: ${{ needs.build.outputs.sha }}
          VERSION: ${{ steps.wheel_info.outputs.version }}
        run: |
          TAG="riscv64-v$VERSION"
          TITLE="riscv64 wheels v$VERSION"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Prebuilt riscv64 wheels for Python 3.10–3.14.

          Built from google/sentencepiece $SRC_TAG (commit $SRC_SHA). The source archives attached by GitHub are from this fork, not that commit.

          Built on: RISE riscv64 runner (ubuntu-24.04-riscv)

          Install:
          \`\`\`
          pip install sentencepiece --find-links https://github.com/${{ github.repository }}/releases/download/$TAG/
          \`\`\`" \
            /tmp/wheels/*.whl \
            /tmp/wheels/SHA256SUMS

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wheels
